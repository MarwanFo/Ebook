services:
  - type: web
    name: bookflow-api
    runtime: node
    plan: free
    buildCommand: pnpm --filter @bookflow/shared-types build && pnpm --filter @bookflow/api db:generate && pnpm --filter @bookflow/api build
    startCommand: pnpm --filter @bookflow/api start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
